<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Documentación de Finpro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --panel:#f7f8fb; --fg:#1b1f2a; --muted:#5b6474; --faint:#8a92a4;
  --line:#e7e9f0; --accent:#4f46e5; --accent-soft:#eef0fe; --code-bg:#f4f5f9;
  --warn:#b4540a; --warn-soft:#fdf1e7; --ok:#1f7a4d; --ok-soft:#e9f6ef;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1016; --panel:#14171f; --fg:#e8eaf0; --muted:#9aa2b2; --faint:#6b7483;
  --line:#242836; --accent:#8b86f8; --accent-soft:#1c1d33; --code-bg:#171a23;
  --warn:#e5a661; --warn-soft:#2a1f12; --ok:#6fcf9b; --ok-soft:#12241a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1016; --panel:#14171f; --fg:#e8eaf0; --muted:#9aa2b2; --faint:#6b7483;
  --line:#242836; --accent:#8b86f8; --accent-soft:#1c1d33; --code-bg:#171a23;
  --warn:#e5a661; --warn-soft:#2a1f12; --ok:#6fcf9b; --ok-soft:#12241a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65}
a{color:var(--accent);text-decoration:none}
img{max-width:100%}

.nav{display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;color:var(--fg)}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.nav-cta{margin-left:auto;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px}
.theme{margin-left:14px;border:1px solid var(--line);background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px}
.menu-btn{display:none;place-items:center;width:32px;height:32px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;cursor:pointer;font-size:16px}
.side-top{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.side-home{flex:1;text-align:left;border:0;background:transparent;font-family:var(--sans);
  color:var(--muted);font-size:13.5px;font-weight:600;padding:7px 10px;border-radius:7px;cursor:pointer}
.side-home:hover{background:var(--accent-soft);color:var(--fg)}
.side-theme{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px}
.side-theme:hover{color:var(--fg);border-color:var(--accent)}
/* modo embebido (dentro de Finpro): sin cabecera propia */
.floatmenu{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:30;
  width:36px;height:36px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;cursor:pointer;place-items:center;font-size:17px}
.embedded .nav{display:none}
.embedded .body{height:100%}
@media(max-width:620px){.embedded .floatmenu{display:grid}}

.body{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100% - 53px)}
.side{overflow:auto;padding:16px 12px 48px;
  background:#203989;
  border-right:1px solid rgba(255,255,255,.08);
  --sfg:#eef1fb; --smuted:#bcc2e6; --sfaint:#9298cb; --shover:rgba(255,255,255,.10);
  color:var(--sfg)}
/* menú lateral sobre el azul de Finpro */
.side .side-home{color:var(--smuted)}
.side .side-home:hover{background:var(--shover);color:#fff}
.side .grp>h4{color:#fff}
.side .chev{color:var(--sfaint)}
.side .pg>.row{color:var(--smuted)}
.side .pg>.row:hover{background:var(--shover);color:#fff}
.side .pg.active>.row{color:#fff;font-weight:600}
.side .sub{color:var(--smuted);border-left-color:transparent}
.side .sub:hover{background:var(--shover);color:#fff}
.side .sub.on{color:#fff;border-color:#fff;font-weight:600;background:var(--shover)}
/* buscador */
.search-wrap{position:relative;margin:2px 4px 12px}
.search-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.55);display:grid;place-items:center;pointer-events:none}
.search-ic svg{width:15px;height:15px}
.search{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;
  font-family:var(--sans);font-size:13.5px;padding:8px 11px 8px 32px;border-radius:9px;outline:none}
.search::placeholder{color:rgba(255,255,255,.55)}
.search:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.13)}
.results{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:40;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:11px;box-shadow:0 20px 44px -16px rgba(0,0,0,.45);
  max-height:62vh;overflow:auto;display:none}
.results.open{display:block}
.ritem{display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
  padding:9px 13px;border-bottom:1px solid var(--line);font-family:var(--sans)}
.ritem:last-child{border-bottom:0}
.ritem:hover,.ritem.sel{background:var(--accent-soft)}
.ritem .rt{font-size:13.5px;font-weight:600;color:var(--fg)}
.ritem .rp{font-size:11px;color:var(--faint);margin-top:1px;letter-spacing:.02em}
.ritem .rs{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.ritem mark{background:rgba(79,70,229,.22);color:var(--accent);padding:0 1px;border-radius:3px;font-weight:600}
.rempty{padding:13px;color:var(--muted);font-size:13px}
.chev{display:inline-block;color:var(--faint);font-size:10px;transition:transform .15s;width:12px;text-align:center}
.grp.closed>.pages{display:none}
.grp.closed>h4 .chev{transform:rotate(-90deg)}
.grp>h4{font-size:14px;font-weight:700;color:var(--fg);margin:12px 4px 4px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.pg{margin:1px 0}
.pg.closed>.subs{display:none}
.pg.closed>.row .chev{transform:rotate(-90deg)}
.pg>.row{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);padding:6px 8px 6px 14px;border-radius:7px;cursor:pointer;user-select:none}
.pg>.row:hover{background:var(--accent-soft);color:var(--fg)}
.pg.active>.row{color:var(--accent);font-weight:600}
.pg>.row>.lbl{flex:1}
.subs{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px}
.sub{font-size:13px;color:var(--muted);padding:5px 8px 5px 34px;border-radius:7px;cursor:pointer;border-left:2px solid transparent;margin-left:17px}
.sub:hover{background:var(--accent-soft);color:var(--fg)}
.sub.on{color:var(--accent);border-color:var(--accent);font-weight:600}

.main{overflow:auto;padding:34px max(28px,env(safe-area-inset-right,0px)) 100px max(28px,env(safe-area-inset-left,0px));min-width:0}
.wrap{max-width:1060px;margin-inline:auto}
.embed-wrap{margin:2px 0 8px}
.embed-deck{width:100%;height:80vh;min-height:560px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:block}
/* portada: centrada respecto de toda la ventana (compensa el ancho del menú) */
@media(min-width:621px){
  #wrap.homeview{max-width:none}
  #wrap.homeview .home{margin-left:max(0px,calc(50vw - 748px));margin-right:0}
}
.crumb{font-size:12.5px;color:var(--faint);margin-bottom:8px;letter-spacing:.02em}
.main h1{font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--muted);font-size:16px;margin:0 0 20px}
.sec{scroll-margin-top:18px}
.sec h2{font-size:21px;font-weight:700;margin:30px 0 10px;letter-spacing:-.01em;padding-top:8px}
.ct-body :is(h3){font-size:16px;margin:18px 0 6px}
.ct-body h4{font-size:13px;font-weight:700;margin:16px 0 6px;letter-spacing:.01em}
.ep-left table{font-size:13.5px}
.ep-left h4:first-child{margin-top:8px}
.ct-body p{margin:0 0 11px;max-width:70ch}
.ct-body ul,.ct-body ol{margin:0 0 12px;padding-left:22px}
.ct-body li{margin:4px 0}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:5px}
figure.code{margin:0 0 14px}
figure.code figcaption{font-size:12px;color:var(--faint);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:0}
pre code{background:none;padding:0;font-size:13px;line-height:1.55}
table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:600}
.callout{border:1px solid var(--line);border-radius:9px;padding:11px 14px 11px 14px;margin:0 0 14px;background:var(--accent-soft);border-left:3px solid var(--accent)}
.callout .ct{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.callout .cb p:last-child{margin-bottom:0}
.callout.warn{background:var(--warn-soft);border-left-color:var(--warn)} .callout.warn .ct{color:var(--warn)}
.callout.tip{background:var(--ok-soft);border-left-color:var(--ok)} .callout.tip .ct{color:var(--ok)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 14px}
ol.steps>li{counter-increment:s;position:relative;padding:3px 0 10px 38px;margin:0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
ol.steps .step-t{font-weight:600;display:block}
.accs{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
details.acc{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
details.acc summary{padding:10px 14px;cursor:pointer;font-weight:600;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:"▸ ";color:var(--faint)}
details.acc[open] summary::before{content:"▾ "}
.acc-b{padding:2px 14px 12px}
.update{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px;background:var(--panel)}
.uhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ubadge{background:var(--accent);color:#fff;font-weight:700;font-size:12px;padding:3px 9px;border-radius:20px}
.udate{color:var(--faint);font-size:13px}
/* portada (centrada) */
.home{max-width:840px;margin:30px auto 0;text-align:center}
.home .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.home h1{font-size:34px;margin:0 0 10px}
.home .home-sub{color:var(--muted);font-size:17px;margin:0 auto 30px;max-width:54ch}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;
  padding:20px;background:var(--panel);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;
  text-align:left;color:var(--fg);font-family:var(--sans);font-size:15px}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 30px -14px rgba(79,70,229,.45)}
.card .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card .ic svg{width:22px;height:22px}
.card h3{margin:0 0 4px;font-size:17px;font-weight:700;color:var(--fg)}
.card p{margin:0;color:var(--muted);font-size:14px;max-width:none}
.card .arr{margin-left:auto;color:var(--faint);align-self:center;transition:transform .15s,color .15s}
.card:hover .arr{color:var(--accent);transform:translateX(3px)}
.brand{cursor:pointer}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 16px;background:var(--panel)}
.shot img{display:block;width:100%}
.shot figcaption{font-size:12.5px;color:var(--faint);padding:7px 12px;border-top:1px solid var(--line)}
/* endpoint en dos columnas: texto a la izquierda, código oscuro al costado */
.ep-row{display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:28px;align-items:start;margin:4px 0 8px}
.ep-left p:last-child{margin-bottom:0}
.ep-right{position:sticky;top:0}
@media(max-width:900px){.ep-row{grid-template-columns:1fr;gap:14px}.ep-right{position:static}}
.ep{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.ep .m{font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;padding:3px 9px;border-radius:6px;background:var(--accent)}
.ep .m-GET{background:#1f7a4d}.ep .m-POST{background:#4f46e5}
.ep .epath{font-family:var(--mono);font-size:13px;background:var(--code-bg);padding:4px 9px;border-radius:6px;word-break:break-all}

/* panel de código oscuro (fijo, independiente del tema) */
.codetabs.dark{--cbg:#0f1526;--cbar:#161d31;--ctext:#e6e9f5;--cmuted:#98a1bd;--cborder:#283150;--con:#a9a4ff;
  background:var(--cbg);border:1px solid var(--cborder);border-radius:11px;overflow:hidden;margin:0 0 12px;color:var(--ctext)}
.codetabs.dark .ctabs{display:flex;align-items:center;gap:4px;background:var(--cbar);border-bottom:1px solid var(--cborder);padding:5px 7px}
.ctabs-scroll{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.codetabs.dark .ctab{border:0;background:transparent;color:var(--cmuted);font-family:var(--sans);font-size:12.5px;font-weight:600;
  padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.codetabs.dark .ctab:hover{color:var(--ctext)}
.codetabs.dark .ctab.on{color:var(--con);border-bottom-color:var(--con)}
.copybtn{flex:none;border:1px solid var(--cborder);background:transparent;color:var(--cmuted);
  display:grid;place-items:center;width:30px;height:28px;border-radius:7px;cursor:pointer;padding:0}
.copybtn svg{width:15px;height:15px}
.copybtn:hover{color:var(--ctext);border-color:var(--con)}
.copybtn.done{color:#6fcf9b;border-color:#6fcf9b}
.runbtn{flex:none;display:inline-flex;align-items:center;gap:5px;border:0;cursor:pointer;background:var(--con);color:#0f1526;font-family:var(--sans);font-size:12px;font-weight:700;padding:6px 11px;border-radius:7px;margin-left:2px;white-space:nowrap}
.runbtn svg{width:11px;height:11px}
.runbtn:hover{filter:brightness(1.08)}
.runwrap{position:relative}
.run-ph{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:11px;padding:15px 16px;color:var(--muted);font-size:13px;background:var(--panel)}
.run-ph.loading{color:var(--accent);border-color:var(--accent)}
.run-ph .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rspin .6s linear infinite;flex:none}
@keyframes rspin{to{transform:rotate(360deg)}}
.resp-label{flex:1;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cmuted);padding-left:6px}
.codetabs.dark .cpane{display:none;margin:0;border:0;border-radius:0;background:var(--cbg)}
.codetabs.dark .cpane.on{display:block}
.codetabs.dark pre.cpane{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:hidden}
.codetabs.dark code{color:var(--ctext);font-size:12.5px;background:none;padding:0}

@media(max-width:620px){
  .body{grid-template-columns:1fr}
  .side{position:fixed;z-index:20;top:0;bottom:0;left:0;width:290px;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .menu-btn{display:inline-grid}
}
</style>
</head>
<body>
<div class="nav">
  <button class="menu-btn" id="menuBtn" aria-label="Menú">☰</button>
  <div class="brand"><span class="logo">F</span>Finpro</div>
  <a class="nav-cta" href="https://app.finpro.com.ar" target="_blank" rel="noopener">Ir a Finpro</a>
</div>
<button class="floatmenu" id="floatMenu" aria-label="Menú">☰</button>
<div class="body">
  <nav class="side" id="side">
    <div class="search-wrap">
      <span class="search-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input id="q" class="search" type="text" placeholder="Buscar en la documentación…" autocomplete="off" spellcheck="false">
      <div id="results" class="results"></div>
    </div>
    <div id="sidenav"></div>
  </nav>
  <main class="main" id="main"><div class="wrap" id="wrap"></div></main>
</div>
<script id="docdata" type="application/json">{"nav": [["Uso de la plataforma", [["manual", "Manual de usuario"]]], ["Integración (API)", [["comofunciona", "Cómo funciona"], ["api", "Integración mediante API"], ["verificacion", "Verificación de transferencias"], ["webhooks", "Webhooks"], ["conciliacion", "Listado para conciliación"]]], ["Bot Finpro-Verificador", [["verificador", "Bot Finpro-Verificador"]]], ["Release Notes", [["release", "Release Notes"]]]], "pages": {"manual": {"title": "Manual de usuario", "crumb": "Uso de la plataforma", "lead": "Guía para navegar y usar todas las funciones del portal Finpro.", "intro": "<p>Este manual te ayuda a navegar y usar todas las funciones de la plataforma.\nDesplegá esta sección para ver cada parte del portal: cuentas, saldos,\nmovimientos, lotes, auditoría, transferencias, seguridad y administración.<\/p>", "secs": [["Mis cuentas", "mis-cuentas", "<figure class=\"shot\"><img src=\"images/mis-cuentas.png\" alt=\"Pantalla principal: Mis cuentas\" loading=\"lazy\"><figcaption>Pantalla principal: Mis cuentas<\/figcaption><\/figure>\n<p>Es la pantalla principal al ingresar: una visión general de todos tus recursos.<\/p>\n<ul>\n<li><strong>Total de cuentas:<\/strong> cuántas cuentas tenés habilitadas.<\/li>\n<li><strong>Bancos:<\/strong> las cuentas se agrupan por la entidad donde están alojadas.<\/li>\n<li><strong>Detalle de cada cuenta:<\/strong> CVU, número de cuenta interno de Finpro, alias y\n  una <strong>etiqueta personalizada<\/strong> (tocá el lápiz para ponerle un nombre propio,\n  por ejemplo \"Cuenta de nómina\" o \"Fondo de reserva\").<\/li>\n<\/ul>\n<div class=\"callout note\"><span class=\"ct\">Nota<\/span><div class=\"cb\"><p><strong>Alerta por saldo mínimo (solo Administrador).<\/strong> Podés configurar un aviso por\n  email cuando el saldo de una cuenta llega o baja del piso definido. Desde la\n  versión 1.5.0 cada cuenta admite más de un destinatario: cargá los correos\n  separados por punto y coma (<code>;<\/code>) y presioná Enter. Con <strong>Enviar prueba<\/strong>\n  verificás que los destinatarios reciban el aviso antes de guardar.<\/p><\/div><\/div>\n<figure class=\"shot\"><img src=\"images/alerta-saldo.png\" alt=\"Alerta por saldo mínimo con varios destinatarios\" loading=\"lazy\"><figcaption>Alerta por saldo mínimo con varios destinatarios<\/figcaption><\/figure>"], ["Saldo", "saldo", "<figure class=\"shot\"><img src=\"images/saldo.png\" alt=\"Consultar saldo\" loading=\"lazy\"><figcaption>Consultar saldo<\/figcaption><\/figure>\n<p>Entrá desde el menú <strong>Saldo<\/strong> o tocando una cuenta en <strong>Mis cuentas<\/strong>. Elegí la\ncuenta y vas a ver número de cuenta, CVU, etiqueta y saldo disponible (último\nvalor consultado).<\/p>\n<div class=\"callout warn\"><span class=\"ct\">Importante<\/span><div class=\"cb\"><p>El saldo no se actualiza automáticamente en todo momento. Para tener el dato\n  más reciente, presioná <strong>Actualizar<\/strong> (ícono de flecha circular) junto a los\n  datos de la cuenta.<\/p><\/div><\/div>"], ["Movimientos", "movimientos", "<figure class=\"shot\"><img src=\"images/movimientos.png\" alt=\"Listado de movimientos con filtros\" loading=\"lazy\"><figcaption>Listado de movimientos con filtros<\/figcaption><\/figure>\n<p>Consultá el detalle completo de ingresos y egresos de las cuentas que elijas.\nOrden sugerido de búsqueda:<\/p>\n<ol>\n<li><strong>Rango de fechas:<\/strong> indicá \"Desde\" y \"Hasta\".<\/li>\n<li><strong>Tipo de movimiento:<\/strong> Entrantes, Salientes, C2C, Comisiones, Reversas o Todos.<\/li>\n<li><strong>Filtros adicionales<\/strong> (opcional): importe, CVU, Coelsa ID o documento del\n   titular destino.<\/li>\n<li><strong>Actualización automática:<\/strong> marcá la casilla para refrescar cada 30 segundos.<\/li>\n<li><strong>Exportar:<\/strong> descargá el listado filtrado en CSV, o los comprobantes en PDF\n   (individual o en ZIP).<\/li>\n<\/ol>"], ["Estado de lotes", "estado-de-lotes", "<figure class=\"shot\"><img src=\"images/estado-lotes.png\" alt=\"Estado de un lote de transferencias\" loading=\"lazy\"><figcaption>Estado de un lote de transferencias<\/figcaption><\/figure>\n<p>Para dar seguimiento a tus transferencias masivas (varios destinos en una sola\noperación).<\/p>\n<ol>\n<li>Al hacer una transferencia masiva, el sistema genera un <strong>Process ID (UUID)<\/strong>. Copialo.<\/li>\n<li>Entrá a <strong>Estado de lotes<\/strong>, pegalo en el buscador y presioná <strong>Consultar<\/strong>.<\/li>\n<\/ol>\n<p>Vas a ver: total de transacciones, exitosas, fallidas y el estado general del\nlote (Pendiente, En proceso, Completado o Fallido).<\/p>"], ["Auditoría", "auditoria", "<figure class=\"shot\"><img src=\"images/auditoria.png\" alt=\"Auditoría de transferencias salientes\" loading=\"lazy\"><figcaption>Auditoría de transferencias salientes<\/figcaption><\/figure>\n<p>Control de las transferencias salientes que enviaste desde tus cuentas. Filtros:<\/p>\n<ul>\n<li><strong>Rango de fechas.<\/strong><\/li>\n<li><strong>Origen:<\/strong> API, Portal web o Todos.<\/li>\n<li><strong>Búsqueda por texto libre:<\/strong> Process ID, usuario, CVU de destino, titular del\n  destinatario o parte de la descripción.<\/li>\n<\/ul>\n<p>Podés exportar los resultados en CSV.<\/p>"], ["Transferencias (paso a paso)", "transferencias-paso-a-paso", "<ol class=\"steps\"><li><span class=\"step-t\">Cuenta de origen<\/span><p>Seleccioná la cuenta desde la que enviás.<\/p><\/li><li><span class=\"step-t\">Monto<\/span><p>Ingresá el importe.<\/p><\/li><li><span class=\"step-t\">Datos del destino<\/span><p>CBU/CVU o Alias, y una descripción opcional.<\/p><\/li><li><span class=\"step-t\">Verificá el destinatario (obligatorio)<\/span><p>Revisá que el nombre mostrado coincida con la persona o empresa correcta.<\/p><\/li><li><span class=\"step-t\">Confirmá la transferencia<\/span><\/li><li><span class=\"step-t\">Autorizá con tu contraseña<\/span><\/li><li><span class=\"step-t\">Guardá el comprobante<\/span><p>Descargá el PDF o copiá los datos.<\/p><\/li><\/ol>\n<figure class=\"shot\"><img src=\"images/transferencia-form.png\" alt=\"Formulario de transferencia\" loading=\"lazy\"><figcaption>Formulario de transferencia<\/figcaption><\/figure>\n<figure class=\"shot\"><img src=\"images/transferencia-confirmar.png\" alt=\"Confirmación con contraseña\" loading=\"lazy\"><figcaption>Confirmación con contraseña<\/figcaption><\/figure>\n<figure class=\"shot\"><img src=\"images/transferencia-comprobante.png\" alt=\"Comprobante de la transferencia\" loading=\"lazy\"><figcaption>Comprobante de la transferencia<\/figcaption><\/figure>"], ["Seguridad (2FA)", "seguridad-2fa", "<figure class=\"shot\"><img src=\"images/seguridad.png\" alt=\"Menú Seguridad\" loading=\"lazy\"><figcaption>Menú Seguridad<\/figcaption><\/figure>\n<p>Agregá una capa extra de seguridad con doble autenticación:<\/p>\n<ol>\n<li>Entrá al menú <strong>Seguridad<\/strong>.<\/li>\n<li>Instalá Google Authenticator en tu teléfono.<\/li>\n<li>Escaneá el código QR y guardá el código de respaldo.<\/li>\n<li>Ingresá el código de 6 dígitos para verificar la configuración.<\/li>\n<\/ol>\n<div class=\"callout tip\"><span class=\"ct\">Tip<\/span><div class=\"cb\"><p>Activar el segundo factor es opcional, pero muy recomendable.<\/p><\/div><\/div>"], ["Release Notes", "release-notes", "<figure class=\"shot\"><img src=\"images/release-notes.png\" alt=\"Menú Release Notes\" loading=\"lazy\"><figcaption>Menú Release Notes<\/figcaption><\/figure>\n<p>El historial de actualizaciones de la plataforma. Es informativo; no requiere\nninguna acción.<\/p>"], ["Gestión de usuarios (solo Administradores)", "gestion-de-usuarios-solo-administradores", "<ul>\n<li><strong>Panel de usuarios:<\/strong> tabla con usuario, nombre, email, rol, cantidad de CVUs,\n  estado y acciones.<\/li>\n<li><strong>Dar de alta:<\/strong> botón <strong>Nuevo Usuario<\/strong> → usuario, clave, nombre, email, rol\n  y cuentas asociadas.<\/li>\n<li><strong>Modificar o visualizar:<\/strong> <em>Visualizar<\/em> solo muestra los datos; <em>Modificar<\/em>\n  permite editar todo y agregar o quitar CVUs.<\/li>\n<\/ul>\n<figure class=\"shot\"><img src=\"images/usuarios.png\" alt=\"Panel de gestión de usuarios\" loading=\"lazy\"><figcaption>Panel de gestión de usuarios<\/figcaption><\/figure>\n<figure class=\"shot\"><img src=\"images/usuario-nuevo.png\" alt=\"Alta de un nuevo usuario\" loading=\"lazy\"><figcaption>Alta de un nuevo usuario<\/figcaption><\/figure>\n<figure class=\"shot\"><img src=\"images/usuario-editar.png\" alt=\"Edición de un usuario\" loading=\"lazy\"><figcaption>Edición de un usuario<\/figcaption><\/figure>\n<h3>Roles<\/h3>\n<table>\n<thead>\n<tr>\n<th>Rol<\/th>\n<th>Qué puede hacer<\/th>\n<th>Ejemplo de uso<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Principal<\/strong><\/td>\n<td>Transferir, exportar movimientos a CSV, acceso a todas las secciones operativas.<\/td>\n<td>Gerente financiero o responsable de pagos.<\/td>\n<\/tr>\n<tr>\n<td><strong>Secundario<\/strong><\/td>\n<td>Transferir, pero <strong>no<\/strong> puede exportar listados masivos a CSV. Resto igual que Principal.<\/td>\n<td>Operadores de pago que no deben descargar datos sensibles.<\/td>\n<\/tr>\n<tr>\n<td><strong>Lector<\/strong><\/td>\n<td><strong>No<\/strong> puede transferir. Solo consulta saldos, movimientos y auditoría.<\/td>\n<td>Contadores externos, supervisores o auditores internos.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"callout note\"><span class=\"ct\">Nota<\/span><div class=\"cb\"><p>El Administrador puede modificar a todos los usuarios excepto a sí mismo; para\n  cambios en su propio perfil, debe contactar a soporte de Finpro.<\/p><\/div><\/div>"], ["IPs (solo Administradores)", "ips-solo-administradores", "<figure class=\"shot\"><img src=\"images/ips.png\" alt=\"Reporte de IPs\" loading=\"lazy\"><figcaption>Reporte de IPs<\/figcaption><\/figure>\n<p>Muestra los inicios y cierres de sesión de tus usuarios, con tres agrupadores:\npor <strong>Sesión<\/strong>, por <strong>Usuario<\/strong> y por <strong>IP<\/strong>.<\/p>"], ["Consulta de COELSA (solo Administradores)", "consulta-de-coelsa-solo-administradores", "<figure class=\"shot\"><img src=\"images/consulta-coelsa.png\" alt=\"Consulta de COELSA\" loading=\"lazy\"><figcaption>Consulta de COELSA<\/figcaption><\/figure>\n<p>Disponible desde la versión 1.5.0. Permite buscar una transferencia puntual por\nsu identificador COELSA sin recorrer todo el listado de Movimientos.<\/p>\n<ol>\n<li>Entrá al menú <strong>Consulta de COELSA<\/strong>.<\/li>\n<li>Escribí el ID COELSA (22 caracteres, figura en el comprobante) en el campo\n   <strong>ID COELSA (coelsa_id)<\/strong>.<\/li>\n<li>Presioná <strong>Consultar<\/strong>: vas a ver cuenta, fecha, monto, origen/destino y estado.<\/li>\n<\/ol>\n<p>Útil para confirmar si una transferencia fue acreditada cuando un cliente envía\nun comprobante.<\/p>"], ["Bot de Telegram \"Finpro-Verificador\"", "bot-de-telegram-finpro-verificador", "<p>Desde la versión 1.5.0, Finpro incluye un asistente de Telegram que verifica si\nun comprobante corresponde a una operación real acreditada en tus cuentas.\nEl manual completo está en <a href=\"/bot/finpro-verificador\">Bot Finpro-Verificador<\/a>.<\/p>"]]}, "api": {"title": "Integración mediante API", "crumb": "Integración (API)", "lead": "Autenticación, balance, CVU/Coelsa, transferencias, estado, resultado y callback.", "intro": "<p>Guía para conectar sistemas externos con el middleware de Finpro usando las\ncredenciales provistas.<\/p>\n<div class=\"callout info\"><span class=\"ct\">Info<\/span><div class=\"cb\"><p><strong>URL base:<\/strong> <code>https://mw-dev.finpro.com.ar<\/code> · <strong>Banco (<code>bankId<\/code>):<\/strong> <code>creedence<\/code>.\n  Cada integración opera con sus propias credenciales (<code>X-API-Key<\/code> y\n  <code>X-API-Secret<\/code>); el middleware gestiona internamente la autenticación con el\n  banco y los tokens bancarios.<\/p><\/div><\/div>\n<div class=\"callout warn\"><span class=\"ct\">Importante<\/span><div class=\"cb\"><p>Documentación pública para integradores. No publiques en estas páginas tus\n  credenciales, tokens ni secretos reales: los valores entre <code>&lt; &gt;<\/code> son ejemplos.\n  El <strong>API Secret se muestra una sola vez<\/strong>; si lo regenerás, el anterior deja de\n  funcionar de inmediato.<\/p><\/div><\/div>", "secs": [["Operaciones", "operaciones", "<ul>\n<li>Obtención de token con credenciales de cliente<\/li>\n<li>Consulta de balance<\/li>\n<li>Consulta de información de CVU / titular (Coelsa), por CVU o por alias<\/li>\n<li>Envío de transferencias por CVU<\/li>\n<li>Consulta de estado de proceso<\/li>\n<li>Consulta de resultado detallado de proceso<\/li>\n<\/ul>"], ["Autenticación", "autenticacion", "<div class=\"ep-row\"><div class=\"ep-left\"><div class=\"ep\"><span class=\"m m-POST\">POST<\/span><code class=\"epath\">/api/banks/creedence/auth/token/client<\/code><\/div><p>Obtené un token con tus credenciales de cliente. El token devuelto se usa como <code>x-access-token<\/code> en las operaciones que lo requieren.<\/p><h4>Headers<\/h4><ul><li><code>X-API-Key<\/code> — tu clave de cliente.<\/li><li><code>X-API-Secret<\/code> — tu secret de cliente.<\/li><li><code>Content-Type: application/json<\/code><\/li><\/ul><h4>Campos de la respuesta<\/h4><table><thead><tr><th>Campo<\/th><th>Descripción<\/th><\/tr><\/thead><tbody><tr><td><code>token<\/code><\/td><td>Token de acceso para las siguientes llamadas.<\/td><\/tr><tr><td><code>token_type<\/code><\/td><td><code>new<\/code> si se generó uno nuevo.<\/td><\/tr><tr><td><code>expires_in<\/code><\/td><td>Segundos de validez (3600 = 1 hora).<\/td><\/tr><tr><td><code>code<\/code><\/td><td><code>0200<\/code> indica éxito.<\/td><\/tr><\/tbody><\/table><p>Esperado: HTTP 200, <code>code = \"0200\"<\/code> y <code>token<\/code> presente.<\/p><\/div><div class=\"ep-right\"><div class=\"codetabs dark\"><div class=\"ctabs\"><div class=\"ctabs-scroll\"><button class=\"ctab on\" data-l=\"curl\">cURL<\/button><button class=\"ctab\" data-l=\"js\">JavaScript<\/button><button class=\"ctab\" data-l=\"py\">Python<\/button><button class=\"ctab\" data-l=\"go\">Go<\/button><button class=\"ctab\" data-l=\"cs\">C#<\/button><button class=\"ctab\" data-l=\"java\">Java<\/button><button class=\"ctab\" data-l=\"php\">PHP<\/button><button class=\"ctab\" data-l=\"ps\">PowerShell<\/button><\/div><button class=\"copybtn\" type=\"button\" title=\"Copiar\" aria-label=\"Copiar\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/><\/svg><\/button><button class=\"runbtn\" type=\"button\" title=\"Ejecutar (demo)\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/><\/svg><span>Ejecutar<\/span><\/button><\/div><div class=\"cpanes\"><pre class=\"cpane on\" data-l=\"curl\"><code>curl -X POST &#x27;https://mw-dev.finpro.com.ar/api/banks/creedence/auth/token/client&#x27; \\\n  -H &#x27;X-API-Key: &lt;api_key_del_cliente&gt;&#x27; \\\n  -H &#x27;X-API-Secret: &lt;api_secret_del_cliente&gt;&#x27; \\\n  -H &#x27;Content-Type: application/json&#x27; \\\n  -d &#x27;{}&#x27;<\/code><\/pre><pre class=\"cpane\" data-l=\"js\"><code>const res = await fetch(&quot;https://mw-dev.finpro.com.ar/api/banks/creedence/auth/token/client&quot;, {\n  method: &quot;POST&quot;,\n  headers: {\n    &quot;X-API-Key&quot;: &quot;&lt;api_key_del_cliente&gt;&quot;,\n    &quot;X-API-Secret&quot;: &quot;&lt;api_secret_del_cliente&gt;&quot;,\n    &quot;Content-Type&quot;: &quot;application/json&quot;\n  },\n  body: JSON.stringify({})\n});\nconst data = await res.json();<\/code><\/pre><pre class=\"cpane\" data-l=\"py\"><code>import requests\n\nresp = requests.post(\n    &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/auth/token/client&quot;,\n    headers={\n      &quot;X-API-Key&quot;: &quot;&lt;api_key_del_cliente&gt;&quot;,\n      &quot;X-API-Secret&quot;: &quot;&lt;api_secret_del_cliente&gt;&quot;\n    },\n    json={},\n)\ndata = resp.json()<\/code><\/pre><pre class=\"cpane\" data-l=\"go\"><code>package main\n\nimport (\n    &quot;bytes&quot;\n    &quot;net/http&quot;\n)\n\nfunc main() {\n    payload := bytes.NewBufferString(`{}`)\n    req, _ := http.NewRequest(&quot;POST&quot;, &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/auth/token/client&quot;, payload)\n    req.Header.Set(&quot;X-API-Key&quot;, &quot;&lt;api_key_del_cliente&gt;&quot;)\n    req.Header.Set(&quot;X-API-Secret&quot;, &quot;&lt;api_secret_del_cliente&gt;&quot;)\n    req.Header.Set(&quot;Content-Type&quot;, &quot;application/json&quot;)\n    res, _ := http.DefaultClient.Do(req)\n    defer res.Body.Close()\n}<\/code><\/pre><pre class=\"cpane\" data-l=\"cs\"><code>using System.Net.Http;\nusing System.Text;\n\nvar client = new HttpClient();\nvar request = new HttpRequestMessage(HttpMethod.Post, &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/auth/token/client&quot;);\nrequest.Headers.Add(&quot;X-API-Key&quot;, &quot;&lt;api_key_del_cliente&gt;&quot;);\nrequest.Headers.Add(&quot;X-API-Secret&quot;, &quot;&lt;api_secret_del_cliente&gt;&quot;);\nrequest.Content = new StringContent(@&quot;{}&quot;, Encoding.UTF8, &quot;application/json&quot;);\nvar response = await client.SendAsync(request);<\/code><\/pre><pre class=\"cpane\" data-l=\"java\"><code>HttpClient client = HttpClient.newHttpClient();\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(&quot;https://mw-dev.finpro.com.ar/api/banks/creedence/auth/token/client&quot;))\n    .header(&quot;X-API-Key&quot;, &quot;&lt;api_key_del_cliente&gt;&quot;)\n    .header(&quot;X-API-Secret&quot;, &quot;&lt;api_secret_del_cliente&gt;&quot;)\n    .header(&quot;Content-Type&quot;, &quot;applic e&quot; = &quot;application/json&quot;\n}\n$body = @&#x27;\n{}\n&#x27;@\n$response = Invoke-RestMethod -Uri &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/processes/{processId}/result&quot; `\n    -Method POST -Headers $headers -Body $body<\/code><\/pre><\/div><\/div><div class=\"runwrap\"><div class=\"run-ph\">Tocá <b>Ejecutar<\/b> para ver la respuesta de ejemplo.<\/div><div class=\"codetabs dark respbox\" hidden><div class=\"ctabs\"><span class=\"resp-label\">Respuesta<\/span><button class=\"copybtn\" type=\"button\" title=\"Copiar\" aria-label=\"Copiar\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/><\/svg><\/button><\/div><div class=\"cpanes\"><pre class=\"cpane on\"><code>{\n  &quot;code&quot;: &quot;0200&quot;,\n  &quot;status&quot;: &quot;finished&quot;,\n  &quot;data&quot;: [\n    {\n      &quot;coelsa_id&quot;: &quot;R7ZG0QNDWKMQLRPG9EXYPO&quot;,\n      &quot;response_code&quot;: &quot;0200&quot;,\n      &quot;response_description&quot;: &quot;ok&quot;,\n      &quot;transfer_type&quot;: &quot;S&quot;,\n      &quot;amount&quot;: &quot;100.00&quot;,\n      &quot;cbu_from&quot;: &quot;0000151500033224203142&quot;,\n      &quot;cbu_to&quot;: &quot;0140000701100088139728&quot;,\n      &quot;authorization_code&quot;: &quot;358164&quot;,\n      &quot;transaction_id&quot;: &quot;TX000000002&quot;\n    }\n  ]\n}<\/code><\/pre><\/div><\/div><\/div><\/div><\/div>"], ["Callback de finalización", "callback-de-finalizacion", "<p>Si informás <code>callback_url<\/code> en la transferencia, el sistema envía un <code>POST<\/code> a esa\nURL con el estado final del proceso. La URL debe ser pública, aceptar <code>POST<\/code> y\nresponder correctamente.<\/p>\n<figure class=\"code\"><figcaption>Payload de callback<\/figcaption><pre><code>{\n  &quot;process_id&quot;: &quot;770e8400-e29b-41d4-a716-446655440002&quot;,\n  &quot;transaction_count&quot;: 1,\n  &quot;transaction_success_count&quot;: 1,\n  &quot;transaction_fail_count&quot;: 0,\n  &quot;transaction_processed_count&quot;: 1,\n  &quot;status&quot;: &quot;finished&quot;\n}<\/code><\/pre><\/figure>\n<p>El callback informa el cierre y los contadores; no trae el detalle por\ntransacción ni el <code>coelsa_id<\/code>.<\/p>"], ["Códigos de error del banco", "codigos-de-error-del-banco", "<p>Cuando el banco rechaza una transferencia, el motivo viene en <code>response_code<\/code> /\n<code>response_description<\/code> dentro del <strong>resultado detallado del proceso<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Código<\/th>\n<th>Texto del banco<\/th>\n<th>Qué es<\/th>\n<th>¿Reintentar?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>2449<\/code><\/td>\n<td>insufficient balance<\/td>\n<td>Saldo insuficiente<\/td>\n<td>No, hasta tener saldo.<\/td>\n<\/tr>\n<tr>\n<td><code>2410<\/code><\/td>\n<td>card blocked<\/td>\n<td>Cuenta destino bloqueada<\/td>\n<td>No.<\/td>\n<\/tr>\n<tr>\n<td><code>2454<\/code><\/td>\n<td>operation is already in progress<\/td>\n<td>Varias transferencias a la vez desde el mismo CVU de origen<\/td>\n<td>Sí, cuando termine la que está en curso.<\/td>\n<\/tr>\n<tr>\n<td><code>2455<\/code><\/td>\n<td>bad request<\/td>\n<td>Pedido mal armado (típico: <code>transaction_id<\/code> &gt; 11 caracteres)<\/td>\n<td>No, corregir el request.<\/td>\n<\/tr>\n<tr>\n<td><code>0414<\/code><\/td>\n<td>to_cvu information not allow<\/td>\n<td>CVU destino no habilitado para recibir<\/td>\n<td>No, verificar el CVU destino.<\/td>\n<\/tr>\n<tr>\n<td><code>0416<\/code><\/td>\n<td>invalid from_cvu<\/td>\n<td>CVU origen inválido<\/td>\n<td>No, corregir el CVU de origen.<\/td>\n<\/tr>\n<tr>\n<td><code>0416<\/code><\/td>\n<td>invalid to_cvu<\/td>\n<td>CVU destino inválido<\/td>\n<td>No, corregir el CVU destino.<\/td>\n<\/tr>\n<tr>\n<td><code>0503<\/code><\/td>\n<td>the request could not be processed<\/td>\n<td>Falla transitoria del banco<\/td>\n<td>Sí, con <code>process_id<\/code> nuevo.<\/td>\n<\/tr>\n<tr>\n<td><code>0500<\/code><\/td>\n<td>texto variable<\/td>\n<td>Error genérico<\/td>\n<td>Evaluar según el texto; si persiste, soporte.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"callout tip\"><span class=\"ct\">Tip<\/span><div class=\"cb\"><p>Para evitar <code>2454<\/code>, enviá las transferencias de un mismo CVU de origen de forma\n  secuencial, esperando el resultado de cada proceso antes del siguiente.<\/p><\/div><\/div>"], ["Recomendaciones", "recomendaciones", "<ul>\n<li>Usá siempre <code>X-API-Key<\/code> + <code>X-API-Secret<\/code>, con el mismo esquema en todas las operaciones.<\/li>\n<li>Guardá el <code>process_id<\/code> de cada transferencia: permite consultar estado,\n  resultado y obtener el <code>coelsa_id<\/code>.<\/li>\n<li>Guardá el API Secret al crearlo o regenerarlo (se muestra una sola vez).<\/li>\n<\/ul>"]]}, "verificacion": {"title": "Verificación de transferencias (API)", "crumb": "Integración (API)", "lead": "Endpoint para consultar si una transferencia entrante fue recibida.", "intro": "<p>Endpoint para que un chatbot o backend consulte si una transferencia entrante fue\nrecibida. (El bot de Telegram para usuarios finales se documenta en\n<a href=\"/bot/finpro-verificador\">Bot Finpro-Verificador<\/a>.)<\/p>\n<p><code>POST /api/banks/{bankId}/transfers/verify/incoming<\/code><\/p>\n<p><strong>Headers:<\/strong> <code>X-API-Key<\/code>, <code>X-API-Secret<\/code>, <code>Content-Type: application/json<\/code>.<\/p>", "secs": [["Request", "request", "<div class=\"ep-row\"><div class=\"ep-left\"><div class=\"ep\"><span class=\"m m-POST\">POST<\/span><code class=\"epath\">/api/banks/creedence/transfers/verify/incoming<\/code><\/div><p>Consultá si una transferencia entrante fue recibida. Enviá un identificador fuerte, o <code>amount<\/code> con ventana temporal y/o CVU.<\/p><h4>Headers<\/h4><ul><li><code>
