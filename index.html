i_secret_del_cliente&gt;&quot;)\n    .header(&quot;Content-Type&quot;, &quot;application/json&quot;)\n    .method(&quot;POST&quot;, HttpRequest.BodyPublishers.ofString(&quot;&quot;&quot;\n{\n  &quot;authorization_code&quot;: &quot;491983&quot;,\n  &quot;amount&quot;: 10,\n  &quot;to_cvu&quot;: &quot;0000151500034526227120&quot;\n}\n&quot;&quot;&quot;))\n    .build();\nHttpResponse&lt;String&gt; response =\n    client.send(request, HttpResponse.BodyHandlers.ofString());<\/code><\/pre><pre class=\"cpane\" data-l=\"php\"><code>$ch = curl_init(&quot;https://mw-dev.finpro.com.ar/api/banks/creedence/transfers/verify/incoming&quot;);\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\ncurl_setopt($ch, CURLOPT_CUSTOMREQUEST, &quot;POST&quot;);\ncurl_setopt($ch, CURLOPT_HTTPHEADER, [\n    &quot;X-API-Key: &lt;api_key_del_cliente&gt;&quot;,\n    &quot;X-API-Secret: &lt;api_secret_del_cliente&gt;&quot;,\n    &quot;Content-Type: application/json&quot;,\n]);\ncurl_setopt($ch, CURLOPT_POSTFIELDS, &#x27;{\n  &quot;authorization_code&quot;: &quot;491983&quot;,\n  &quot;amount&quot;: 10,\n  &quot;to_cvu&quot;: &quot;0000151500034526227120&quot;\n}&#x27;);\n$response = curl_exec($ch);\ncurl_close($ch);<\/code><\/pre><pre class=\"cpane\" data-l=\"ps\"><code>$headers = @{\n    &quot;X-API-Key&quot; = &quot;&lt;api_key_del_cliente&gt;&quot;\n    &quot;X-API-Secret&quot; = &quot;&lt;api_secret_del_cliente&gt;&quot;\n    &quot;Content-Type&quot; = &quot;application/json&quot;\n}\n$body = @&#x27;\n{\n  &quot;authorization_code&quot;: &quot;491983&quot;,\n  &quot;amount&quot;: 10,\n  &quot;to_cvu&quot;: &quot;0000151500034526227120&quot;\n}\n&#x27;@\n$response = Invoke-RestMethod -Uri &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/transfers/verify/incoming&quot; `\n    -Method POST -Headers $headers -Body $body<\/code><\/pre><\/div><\/div><div class=\"runwrap\"><div class=\"run-ph\">Tocá <b>Ejecutar<\/b> para ver la respuesta de ejemplo.<\/div><div class=\"codetabs dark respbox\" hidden><div class=\"ctabs\"><span class=\"resp-label\">Respuesta<\/span><button class=\"copybtn\" type=\"button\" title=\"Copiar\" aria-label=\"Copiar\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/><\/svg><\/button><\/div><div class=\"cpanes\"><pre class=\"cpane on\"><code>{\n  &quot;status&quot;: &quot;confirmed&quot;,\n  &quot;matched_by&quot;: &quot;authorization_code&quot;,\n  &quot;confidence&quot;: &quot;exact&quot;,\n  &quot;notification&quot;: {\n    &quot;id&quot;: 2249212,\n    &quot;amount&quot;: &quot;10.00&quot;,\n    &quot;authorization_code&quot;: &quot;491983&quot;,\n    &quot;to_cvu&quot;: &quot;0000151500034526227120&quot;\n  },\n  &quot;searched_scope&quot;: {\n    &quot;bank_id&quot;: &quot;creedence&quot;,\n    &quot;attempted_strategies&quot;: [\n      &quot;authorization_code&quot;\n    ]\n  }\n}<\/code><\/pre><\/div><\/div><\/div><\/div><\/div>"], ["Response", "response", "<p>Campos: <code>status<\/code>, <code>matched_by<\/code>, <code>confidence<\/code>, <code>notification<\/code>, <code>matches<\/code>, <code>searched_scope<\/code>.<\/p>\n<ul>\n<li><strong><code>status<\/code>:<\/strong> <code>confirmed<\/code>, <code>not_found_yet<\/code>, <code>ambiguous<\/code>.<\/li>\n<li><strong><code>matched_by<\/code>:<\/strong> <code>coelsa_id<\/code>, <code>authorization_code<\/code>, <code>amount_date_cvu<\/code>, <code>amount_date_account<\/code>, <code>document<\/code>.<\/li>\n<li><strong><code>confidence<\/code>:<\/strong> <code>exact<\/code>, <code>high<\/code>, <code>medium<\/code>.<\/li>\n<\/ul>\n<figure class=\"code\"><figcaption>confirmed<\/figcaption><pre><code>{\n  &quot;status&quot;: &quot;confirmed&quot;,\n  &quot;matched_by&quot;: &quot;authorization_code&quot;,\n  &quot;confidence&quot;: &quot;exact&quot;,\n  &quot;notification&quot;: {\n    &quot;id&quot;: 2249212,\n    &quot;amount&quot;: &quot;10.00&quot;,\n    &quot;authorization_code&quot;: &quot;491983&quot;,\n    &quot;to_cvu&quot;: &quot;0000151500034526227120&quot;\n  },\n  &quot;searched_scope&quot;: { &quot;bank_id&quot;: &quot;creedence&quot;, &quot;attempted_strategies&quot;: [&quot;authorization_code&quot;] }\n}<\/code><\/pre><\/figure>\n<table>\n<thead>\n<tr>\n<th>status<\/th>\n<th>Interpretación<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>confirmed<\/code><\/td>\n<td>Existe una notificación compatible: la transferencia puede considerarse encontrada.<\/td>\n<\/tr>\n<tr>\n<td><code>not_found_yet<\/code><\/td>\n<td>No se encontró al momento de la consulta. No implica rechazo definitivo.<\/td>\n<\/tr>\n<tr>\n<td><code>ambiguous<\/code><\/td>\n<td>Más de una coincidencia posible: se requiere un dato adicional.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"], ["Alcance", "alcance", "<p>El middleware restringe la búsqueda al cliente autenticado (sus CVUs y cuentas\nactivas): no devuelve coincidencias fuera de ese alcance ni expone movimientos\nde otros clientes.<\/p>"], ["Errores", "errores", "<p><code>400<\/code> request insuficiente / fecha o amount inválidos / <code>window_minutes<\/code> fuera de\nrango · <code>401<\/code> credenciales inválidas o cliente inactivo · <code>403<\/code> sin permiso\n<code>movements<\/code> · <code>500<\/code> error interno.<\/p>\n<div class=\"callout note\"><span class=\"ct\">Nota<\/span><div class=\"cb\"><p>Versión actual: valida entrantes acreditadas; no cubre reversas (<code>revct<\/code>) ni\n  resuelve automáticamente casos ambiguos.<\/p><\/div><\/div>"]]}, "webhooks": {"title": "Webhooks", "crumb": "Integración (API)", "lead": "Notificaciones firmadas de transferencias salientes y eventos bancarios.", "intro": "<p>La plataforma puede enviar webhooks para informar eventos de transferencias.\nHay dos tipos:<\/p>\n<ul>\n<li><strong>Webhook principal:<\/strong> resultado de transferencias <strong>salientes<\/strong> iniciadas vía API.<\/li>\n<li><strong>Webhook secundario:<\/strong> eventos bancarios asociados a los CVUs configurados\n  para el cliente (pueden incluir entrantes y salientes).<\/li>\n<\/ul>", "secs": [["Seguridad", "seguridad", "<p>Cada webhook se firma con <strong>HMAC-SHA256<\/strong>.<\/p>\n<p><strong>Headers:<\/strong> <code>Content-Type: application/json<\/code>, <code>X-Webhook-Signature<\/code>, <code>X-Webhook-Timestamp<\/code>.<\/p>\n<figure class=\"code\"><figcaption>Firma<\/figcaption><pre><code>HMAC-SHA256(timestamp + &quot;.&quot; + payload_json, secret)<\/code><\/pre><\/figure>\n<ul>\n<li><code>timestamp<\/code>: el valor de <code>X-Webhook-Timestamp<\/code> (Unix en segundos).<\/li>\n<li><code>payload_json<\/code>: el body exacto enviado.<\/li>\n<li><code>secret<\/code>: el secret compartido para ese webhook.<\/li>\n<li><code>X-Webhook-Signature<\/code>: hash HMAC-SHA256 en hexadecimal.<\/li>\n<\/ul>\n<ol class=\"steps\"><li><span class=\"step-t\">Leé el body crudo<\/span><\/li><li><span class=\"step-t\">Recalculá la firma con el secret correspondiente<\/span><\/li><li><span class=\"step-t\">Compará con X-Webhook-Signature<\/span><\/li><li><span class=\"step-t\">Respondé HTTP 200 solo si la validación es correcta<\/span><\/li><\/ol>"], ["Parámetros operativos", "parametros-operativos", "<p>Por defecto: timeout de 10000 ms y hasta 3 intentos (ajustables por\nconfiguración). Ante fallo puede haber reintentos con backoff exponencial. Se\nespera respuesta HTTP 2xx, por ejemplo <code>{ \"success\": true }<\/code>.<\/p>"], ["Webhook principal: resultado de transferencias salientes", "webhook-principal-resultado-de-transferencias-salientes", "<p>Se envía a la <code>callback_url<\/code> informada en la solicitud de transferencia (la\nfuncionalidad debe estar habilitada para el cliente).<\/p>\n<figure class=\"code\"><figcaption>Payload<\/figcaption><pre><code>{\n  &quot;status&quot;: &quot;completed&quot;,\n  &quot;process_id&quot;: &quot;660e8400-e29b-41d4-a716-446655440001&quot;,\n  &quot;transaction_id&quot;: &quot;TX000000002&quot;,\n  &quot;transaction_success_count&quot;: 1,\n  &quot;transaction_fail_count&quot;: 0,\n  &quot;data&quot;: [\n    {\n      &quot;coelsa_id&quot;: &quot;R7ZG0QNDWKMQLRPG9EXYPO&quot;,\n      &quot;response_code&quot;: &quot;0200&quot;,\n      &quot;amount&quot;: &quot;100.00&quot;,\n      &quot;cbu_from&quot;: &quot;0000151500033224203142&quot;,\n      &quot;cbu_to&quot;: &quot;0140000701100088139728&quot;,\n      &quot;authorization_code&quot;: &quot;358164&quot;\n    }\n  ]\n}<\/code><\/pre><\/figure>\n<p>Estados posibles: <code>completed<\/code> (finalizó correctamente) o <code>failed<\/code> (rechazada o fallida).<\/p>"], ["Webhook secundario: eventos bancarios de los CVUs", "webhook-secundario-eventos-bancarios-de-los-cvus", "<p>Se envía a la URL configurada (<code>webhook_incoming_url<\/code>).<\/p>\n<figure class=\"code\"><figcaption>Payload<\/figcaption><pre><code>{\n  &quot;notification_id&quot;: 12345,\n  &quot;bank_id&quot;: &quot;creedence&quot;,\n  &quot;webhook_type&quot;: &quot;notification&quot;,\n  &quot;notification_type&quot;: &quot;CT&quot;,\n  &quot;received_at&quot;: &quot;2026-03-20T15:30:45.000Z&quot;,\n  &quot;transaction_data&quot;: {\n    &quot;transfer_type&quot;: &quot;E&quot;,\n    &quot;coelsa_id&quot;: &quot;Z6OLMDN3VYMYJQ0W2E7RQ5&quot;,\n    &quot;amount&quot;: &quot;15000.00&quot;,\n    &quot;cbu_from&quot;: &quot;0000003100011447615683&quot;,\n    &quot;cbu_to&quot;: &quot;0000151500033224203142&quot;\n  }\n}<\/code><\/pre><\/figure>\n<p><code>transfer_type = \"E\"<\/code> indica entrante; <code>cbu_to<\/code> es el CVU destino que recibió fondos.<\/p>"], ["Recomendaciones", "recomendaciones", "<p>El endpoint receptor debería aceptar <code>POST<\/code>, procesar <code>application/json<\/code>, validar\nla firma HMAC-SHA256, responder 2xx, registrar logs y contemplar recepciones\nrepetidas del mismo evento.<\/p>"], ["Alta de la integración", "alta-de-la-integracion", "<p>Para configurar necesitamos: si usan la <code>callback_url<\/code> de la operación para el\nwebhook principal; la URL destino del secundario; y el secret de firma (lo genera\nla plataforma o lo definen ustedes).<\/p>"]]}, "conciliacion": {"title": "Listado de transacciones para conciliación", "crumb": "Integración (API)", "lead": "Endpoint para listar pay in, pay out, reversas y C2C por rango de fechas.", "intro": "<p>Endpoint para conciliación: lista pay in, pay out, reversas y C2C por rango de\nfechas, con paginación por cursor.<\/p>\n<table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Método<\/td>\n<td><code>GET<\/code><\/td>\n<\/tr>\n<tr>\n<td>Ruta<\/td>\n<td><code>/api/banks/creedence/reconciliation/transactions<\/code><\/td>\n<\/tr>\n<tr>\n<td>Autenticación<\/td>\n<td>Headers <code>X-API-Key<\/code> y <code>X-API-Secret<\/code> (mismas que Pay In / Pay Out)<\/td>\n<\/tr>\n<tr>\n<td>Permiso<\/td>\n<td><code>movements<\/code><\/td>\n<\/tr>\n<tr>\n<td>Alcance<\/td>\n<td>Solo operaciones de los CVUs/cuentas activas de tu integración<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"callout warn\"><span class=\"ct\">Importante<\/span><div class=\"cb\"><p>No envíes listas de CVU en la query: el alcance se determina por tus\n  credenciales. Si mandás <code>cvus<\/code> o <code>client_id<\/code> en la URL, se ignoran.<\/p><\/div><\/div>", "secs": [["Parámetros de consulta", "parametros-de-consulta", "<table>\n<thead>\n<tr>\n<th>Parámetro<\/th>\n<th>Obligatorio<\/th>\n<th>Descripción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>from<\/code><\/td>\n<td>Sí<\/td>\n<td>Fecha inicio <code>YYYY-MM-DD<\/code> (hora Argentina, inicio del día inclusive).<\/td>\n<\/tr>\n<tr>\n<td><code>to<\/code><\/td>\n<td>Sí<\/td>\n<td>Fecha fin <code>YYYY-MM-DD<\/code> (fin del día inclusive).<\/td>\n<\/tr>\n<tr>\n<td><code>limit<\/code><\/td>\n<td>No<\/td>\n<td>Ítems por página. Default 500, máximo 2000.<\/td>\n<\/tr>\n<tr>\n<td><code>cursor_occurred_at<\/code><\/td>\n<td>No<\/td>\n<td>Cursor de la página siguiente (va con <code>cursor_id<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>cursor_id<\/code><\/td>\n<td>No<\/td>\n<td>Identificador del ítem cursor (va con <code>cursor_occurred_at<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>include_failed<\/code><\/td>\n<td>No<\/td>\n<td>Default <code>true<\/code>. Con <code>false<\/code> excluye pay outs <code>failed<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>operation_kind<\/code><\/td>\n<td>No<\/td>\n<td>CSV: <code>pay_in<\/code>, <code>pay_out<\/code>, <code>reversal<\/code>, <code>c2c<\/code>. Ausente → todos. Valor desconocido → 400.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rango máximo por request: <strong>30 días<\/strong> calendario. Para más histórico, ventanas\nconsecutivas. Varias consultas por día permitidas.<\/p>"], ["Campos comunes", "campos-comunes", "<table>\n<thead>\n<tr>\n<th>Campo<\/th>\n<th>Tipo<\/th>\n<th>Descripción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>operation_kind<\/code><\/td>\n<td>string<\/td>\n<td><code>pay_in<\/code> | <code>pay_out<\/code> | <code>reversal<\/code> | <code>c2c<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>direction<\/code><\/td>\n<td>string | null<\/td>\n<td><code>in<\/code> | <code>out<\/code> | <code>internal<\/code> | null<\/td>\n<\/tr>\n<tr>\n<td><code>occurred_at<\/code><\/td>\n<td>ISO 8601<\/td>\n<td>Timestamp para orden y conciliación<\/td>\n<\/tr>\n<tr>\n<td><code>currency<\/code><\/td>\n<td>string<\/td>\n<td>Siempre <code>\"ARS\"<\/code> en v1<\/td>\n<\/tr>\n<tr>\n<td><code>amount<\/code><\/td>\n<td>number | null<\/td>\n<td>Monto<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>direction<\/code> por tipo: <code>pay_in → in<\/code>, <code>pay_out → out<\/code>, <code>c2c → según CVUs<\/code>,\n<code>reversal → null<\/code>. Cada operación aparece una sola vez. No incluye comisiones.<\/p>\n<h3>Pay out: estados<\/h3>\n<p><code>accepted<\/code> · <code>pending<\/code> · <code>in_progress<\/code> · <code>completed<\/code> · <code>failed<\/code>.<\/p>\n<div class=\"callout note\"><span class=\"ct\">Nota<\/span><div class=\"cb\"><p><code>accepted<\/code> ≠ dinero movido: es \"orden aceptada\" (aparece si el pay out salió sin\n  <code>callback_url<\/code>). <code>failure_reason<\/code> es siempre <code>null<\/code> en v1; usá <code>status = \"failed\"<\/code>.\n  El feed incluye intentos <code>failed<\/code> a propósito, para matchear contra tu ledger\n  (excluilos con <code>include_failed=false<\/code>).<\/p><\/div><\/div>\n<h3>Reversas<\/h3>\n<p>Se identifican por <code>notification_type = revct<\/code>, <code>authorization_code = REVERSO<\/code> o\n<code>coelsa_id<\/code> con prefijo <code>REV_<\/code>. Usá el <code>operation_kind<\/code> que da la API; no\nreimplementes la detección.<\/p>"], ["Paginación", "paginacion", "<p>Orden: <code>occurred_at<\/code> descendente. Si hay más resultados:<\/p>\n<figure class=\"code\"><pre><code>&quot;next_cursor&quot;: { &quot;occurred_at&quot;: &quot;2026-07-29T14:30:00.000Z&quot;, &quot;id&quot;: &quot;wn:12345678&quot; }<\/code><\/pre><\/figure>\n<p>Reenviá <code>from<\/code>, <code>to<\/code>, <code>limit<\/code> y el cursor sin modificarlo.<\/p>\n<div class=\"callout warn\"><span class=\"ct\">Importante<\/span><div class=\"cb\"><p>Seguí paginando hasta que <code>next_cursor<\/code> sea <code>null<\/code>. Una página puede volver con\n  <code>transactions: []<\/code> y <code>next_cursor<\/code> distinto de null (sobre todo filtrando por un\n  <code>operation_kind<\/code> poco frecuente). <strong>No cortes al ver una página vacía.<\/strong> Los\n  prefijos del <code>cursor_id<\/code> (<code>wn:<\/code> / <code>po:<\/code>) son opacos: reenvialos tal cual.<\/p><\/div><\/div>"], ["Errores", "errores", "<table>\n<thead>\n<tr>\n<th>Código<\/th>\n<th>Significado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>400<\/td>\n<td>Fechas inválidas, rango excesivo, cursor incompleto, <code>operation_kind<\/code> desconocido, o cliente sin CVUs activos<\/td>\n<\/tr>\n<tr>\n<td>401<\/td>\n<td>Credenciales inválidas o cliente inactivo<\/td>\n<\/tr>\n<tr>\n<td>403<\/td>\n<td>Sin permiso <code>movements<\/code><\/td>\n<\/tr>\n<tr>\n<td>404<\/td>\n<td>Endpoint no habilitado para tu cliente<\/td>\n<\/tr>\n<tr>\n<td>429<\/td>\n<td>Rate limit; respetar <code>retryAfter<\/code> si viene en el cuerpo<\/td>\n<\/tr>\n<tr>\n<td>500<\/td>\n<td>Error interno; reintentar con backoff<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rate limit típico: ~60 req/min. Ante 429/5xx → backoff; ante 400/401/403 →\ncorregir request o credenciales.<\/p>"], ["Ejemplo", "ejemplo", "<div class=\"ep-row\"><div class=\"ep-left\"><div class=\"ep\"><span class=\"m m-GET\">GET<\/span><code class=\"epath\">/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500<\/code><\/div><p>Consulta de un rango de fechas. El alcance se determina por tus credenciales.<\/p><h4>Headers<\/h4><ul><li><code>X-API-Key<\/code> — tu clave de cliente.<\/li><li><code>X-API-Secret<\/code> — tu secret de cliente.<\/li><\/ul><h4>Parámetros (query)<\/h4><table><thead><tr><th>Campo<\/th><th>Descripción<\/th><\/tr><\/thead><tbody><tr><td><code>from / to<\/code><\/td><td>Rango <code>YYYY-MM-DD<\/code> (máximo 30 días).<\/td><\/tr><tr><td><code>limit<\/code><\/td><td>Ítems por página (default 500, máximo 2000).<\/td><\/tr><tr><td><code>operation_kind<\/code><\/td><td><code>pay_in<\/code>, <code>pay_out<\/code>, <code>reversal<\/code>, <code>c2c<\/code>.<\/td><\/tr><tr><td><code>include_failed<\/code><\/td><td><code>false<\/code> excluye los pay outs fallidos.<\/td><\/tr><\/tbody><\/table><h4>Campos de la respuesta<\/h4><table><thead><tr><th>Campo<\/th><th>Descripción<\/th><\/tr><\/thead><tbody><tr><td><code>operation_kind / direction<\/code><\/td><td>Tipo de operación y sentido.<\/td><\/tr><tr><td><code>amount / currency<\/code><\/td><td>Monto y moneda (ARS).<\/td><\/tr><tr><td><code>status<\/code><\/td><td>Estado del pay out.<\/td><\/tr><tr><td><code>pagination.next_cursor<\/code><\/td><td>Cursor de la página siguiente (<code>null<\/code> = última).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"ep-right\"><div class=\"codetabs dark\"><div class=\"ctabs\"><div class=\"ctabs-scroll\"><button class=\"ctab on\" data-l=\"curl\">cURL<\/button><button class=\"ctab\" data-l=\"js\">JavaScript<\/button><button class=\"ctab\" data-l=\"py\">Python<\/button><button class=\"ctab\" data-l=\"go\">Go<\/button><button class=\"ctab\" data-l=\"cs\">C#<\/button><button class=\"ctab\" data-l=\"java\">Java<\/button><button class=\"ctab\" data-l=\"php\">PHP<\/button><button class=\"ctab\" data-l=\"ps\">PowerShell<\/button><\/div><button class=\"copybtn\" type=\"button\" title=\"Copiar\" aria-label=\"Copiar\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/><\/svg><\/button><button class=\"runbtn\" type=\"button\" title=\"Ejecutar (demo)\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"/><\/svg><span>Ejecutar<\/span><\/button><\/div><div class=\"cpanes\"><pre class=\"cpane on\" data-l=\"curl\"><code>curl -X GET &#x27;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&#x27; \\\n  -H &#x27;X-API-Key: &lt;api_key_del_cliente&gt;&#x27; \\\n  -H &#x27;X-API-Secret: &lt;api_secret_del_cliente&gt;&#x27;<\/code><\/pre><pre class=\"cpane\" data-l=\"js\"><code>const res = await fetch(&quot;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&quot;, {\n  method: &quot;GET&quot;,\n  headers: {\n    &quot;X-API-Key&quot;: &quot;&lt;api_key_del_cliente&gt;&quot;,\n    &quot;X-API-Secret&quot;: &quot;&lt;api_secret_del_cliente&gt;&quot;\n  }\n});\nconst data = await res.json();<\/code><\/pre><pre class=\"cpane\" data-l=\"py\"><code>import requests\n\nresp = requests.get(\n    &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&quot;,\n    headers={\n      &quot;X-API-Key&quot;: &quot;&lt;api_key_del_cliente&gt;&quot;,\n      &quot;X-API-Secret&quot;: &quot;&lt;api_secret_del_cliente&gt;&quot;\n    },\n)\ndata = resp.json()<\/code><\/pre><pre class=\"cpane\" data-l=\"go\"><code>package main\n\nimport (\n    &quot;net/http&quot;\n)\n\nfunc main() {\n    req, _ := http.NewRequest(&quot;GET&quot;, &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&quot;, nil)\n    req.Header.Set(&quot;X-API-Key&quot;, &quot;&lt;api_key_del_cliente&gt;&quot;)\n    req.Header.Set(&quot;X-API-Secret&quot;, &quot;&lt;api_secret_del_cliente&gt;&quot;)\n    res, _ := http.DefaultClient.Do(req)\n    defer res.Body.Close()\n}<\/code><\/pre><pre class=\"cpane\" data-l=\"cs\"><code>using System.Net.Http;\nusing System.Text;\n\nvar client = new HttpClient();\nvar request = new HttpRequestMessage(HttpMethod.Get, &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&quot;);\nrequest.Headers.Add(&quot;X-API-Key&quot;, &quot;&lt;api_key_del_cliente&gt;&quot;);\nrequest.Headers.Add(&quot;X-API-Secret&quot;, &quot;&lt;api_secret_del_cliente&gt;&quot;);\nvar response = await client.SendAsync(request);<\/code><\/pre><pre class=\"cpane\" data-l=\"java\"><code>HttpClient client = HttpClient.newHttpClient();\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(&quot;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&quot;))\n    .header(&quot;X-API-Key&quot;, &quot;&lt;api_key_del_cliente&gt;&quot;)\n    .header(&quot;X-API-Secret&quot;, &quot;&lt;api_secret_del_cliente&gt;&quot;)\n    .method(&quot;GET&quot;, HttpRequest.BodyPublishers.noBody())\n    .build();\nHttpResponse&lt;String&gt; response =\n    client.send(request, HttpResponse.BodyHandlers.ofString());<\/code><\/pre><pre class=\"cpane\" data-l=\"php\"><code>$ch = curl_init(&quot;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&quot;);\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\ncurl_setopt($ch, CURLOPT_CUSTOMREQUEST, &quot;GET&quot;);\ncurl_setopt($ch, CURLOPT_HTTPHEADER, [\n    &quot;X-API-Key: &lt;api_key_del_cliente&gt;&quot;,\n    &quot;X-API-Secret: &lt;api_secret_del_cliente&gt;&quot;,\n]);\n$response = curl_exec($ch);\ncurl_close($ch);<\/code><\/pre><pre class=\"cpane\" data-l=\"ps\"><code>$headers = @{\n    &quot;X-API-Key&quot; = &quot;&lt;api_key_del_cliente&gt;&quot;\n    &quot;X-API-Secret&quot; = &quot;&lt;api_secret_del_cliente&gt;&quot;\n}\n$response = Invoke-RestMethod -Uri &quot;https://mw-dev.finpro.com.ar/api/banks/creedence/reconciliation/transactions?from=2026-07-28&amp;to=2026-08-04&amp;limit=500&quot; `\n    -Method GET -Headers $headers<\/code><\/pre><\/div><\/div><div class=\"runwrap\"><div class=\"run-ph\">Tocá <b>Ejecutar<\/b> para ver la respuesta de ejemplo.<\/div><div class=\"codetabs dark respbox\" hidden><div class=\"ctabs\"><span class=\"resp-label\">Respuesta<\/span><button class=\"copybtn\" type=\"button\" title=\"Copiar\" aria-label=\"Copiar\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/><\/svg><\/button><\/div><div class=\"cpanes\"><pre class=\"cpane on\"><code>{\n  &quot;transactions&quot;: [\n    {\n      &quot;operation_kind&quot;: &quot;pay_out&quot;,\n      &quot;direction&quot;: &quot;out&quot;,\n      &quot;occurred_at&quot;: &quot;2026-07-28T16:00:00.000Z&quot;,\n      &quot;currency&quot;: &quot;ARS&quot;,\n      &quot;amount&quot;: 1500.5,\n      &quot;process_id&quot;: &quot;770e8400-e29b-41d4-a716-446655440002&quot;,\n      &quot;coelsa_id&quot;: &quot;46YGOW9M13KOZJE8NEXD8J&quot;,\n      &quot;status&quot;: &quot;completed&quot;,\n      &quot;description&quot;: &quot;Pago proveedor&quot;,\n      &quot;destination_name&quot;: &quot;Proveedor SA&quot;\n    }\n  ],\n  &quot;pagination&quot;: {\n    &quot;limit&quot;: 500,\n    &quot;count&quot;: 1,\n    &quot;next_cursor&quot;: null\n  }\n}<\/code><\/pre><\/div><\/div><\/div><\/div><\/div>"]]}, "verificador": {"title": "Bot Finpro-Verificador", "crumb": "Bot Finpro-Verificador", "lead": "Cómo mandar un comprobante por Telegram y entender cada respuesta del bot.", "intro": "<p><strong>Finpro-Verificador<\/strong> es un asistente automático de Telegram. Le mandás la foto\no el PDF de un comprobante de transferencia y en unos segundos te dice si esa\ntransferencia realmente llegó a la cuenta de destino, con el monto correcto.<\/p>\n<p>Consulta en tiempo real los movimientos reales de la cuenta: no mira cómo se ve\nel comprobante, sino si la transferencia existe de verdad. Por eso detecta\ncomprobantes editados, repetidos o de otra cuenta.<\/p>\n<figure class=\"shot\"><img src=\"images/bot-telegram.png\" alt=\"Bot Finpro-Verificador en Telegram\" loading=\"lazy\"><figcaption>El bot Finpro-Verificador en Telegram<\/figcaption><\/figure>\n<div class=\"callout note\"><span class=\"ct\">Nota<\/span><div class=\"cb\"><p><strong>El bot no hace transferencias, no devuelve dinero, no muestra saldos y no\n  responde preguntas.<\/strong> Entiende fotos y PDFs de comprobantes y los reclamos de\n  proveedores con el formato del final. Para cualquier otra consulta: soporte por\n  WhatsApp.<\/p><\/div><\/div>", "secs": [["Antes de empezar", "antes-de-empezar", "<ul>\n<li>Tené <strong>Telegram<\/strong> instalado (celular o computadora).<\/li>\n<li>Hacé la transferencia a una de las <strong>cuentas oficiales<\/strong> que te indicaron.<\/li>\n<li>Tené el comprobante de tu banco o billetera (captura, foto o PDF).<\/li>\n<\/ul>\n<p>Buscá el bot por su nombre (ej. \"Finpro-Verificador\"), tocá <strong>Iniciar<\/strong> o mandá\n<code>/start<\/code>. No hace falta registrarse. Habla con vos en tu chat privado; también\nfunciona en grupos si ustedes lo prefieren.<\/p>\n<div class=\"callout warn\"><span class=\"ct\">Importante<\/span><div class=\"cb\"><p><strong>El comprobante lo tiene que mandar una persona, no otro bot.<\/strong> Telegram no\n  permite que un bot vea mensajes de otro bot (regla de la plataforma, no se puede\n  desactivar). Si un bot propio publica el comprobante, Finpro-Verificador no lo\n  ve. Para que se valide, una persona tiene que mandarlo o <strong>reenviarlo (forward)<\/strong>\n  con su cuenta.<\/p><\/div><\/div>"], ["Cómo mandar un comprobante", "como-mandar-un-comprobante", "<ol class=\"steps\"><li><span class=\"step-t\">Transferí<\/span><p>Desde tu banco o billetera a la cuenta indicada.<\/p><\/li><li><span class=\"step-t\">Guardá el comprobante<\/span><p>Captura de pantalla o PDF de la app.<\/p><\/li><li><span class=\"step-t\">Mandáselo al bot<\/span><p>Como foto o como archivo PDF.<\/p><\/li><li><span class=\"step-t\">Esperá unos segundos<\/span><p>Verás \"🔍 Analizando tu comprobante...\" (3 a 20 segundos).<\/p><\/li><li><span class=\"step-t\">Leé la respuesta<\/span><p>Correcto, pendiente, validado anteriormente o inválido, siempre con el motivo.<\/p><\/li><\/ol>\n<p>Cada comprobante recibe un <strong>ID propio<\/strong> con formato <code>CBT-000123<\/code>. Aparece en\ntodas las respuestas y es el mismo que ve soporte: si consultás algo, pasá ese ID.<\/p>\n<h3>Qué tiene que verse en el comprobante<\/h3>\n<ul>\n<li>El <strong>monto<\/strong> transferido.<\/li>\n<li>El <strong>código Coelsa<\/strong> (también \"Código de identificación\" en Mercado Pago): 22\n  letras y números. Es el dato más importante: con él la verificación es exacta.<\/li>\n<li>El <strong>CVU o CBU de destino<\/strong>.<\/li>\n<li>Tu <strong>nombre<\/strong> como titular de la cuenta que envió.<\/li>\n<li>La <strong>fecha y hora<\/strong>.<\/li>\n<\/ul>\n<div class=\"callout tip\"><span class=\"ct\">Tip<\/span><div class=\"cb\"><p>El \"N.° de operación\" de Mercado Pago y el \"código de autorización\" (6 dígitos)\n  <strong>no<\/strong> son el código Coelsa. Mandá siempre el comprobante completo, sin recortar,\n  donde figure el Coelsa. Si es foto de otra pantalla, que salga derecha y con\n  buena luz. Un comprobante por mensaje.<\/p><\/div><\/div>"], ["Las respuestas del bot", "las-respuestas-del-bot", "<div class=\"accs\"><details class=\"acc\"><summary>✅ Comprobante correcto<\/summary><div class=\"acc-b\"><p>La transferencia existe, llegó a la cuenta correcta y el monto coincide. Queda\n    registrada automáticamente. No hay que hacer nada; si querés, guardá una\n    captura como constancia.<\/p><\/div><\/details><details class=\"acc\"><summary>⏳ Pendiente de acreditación<\/summary><div class=\"acc-b\"><p>El comprobante se leyó bien, pero la transferencia todavía no aparece en la\n    cuenta (normal cuando recién transferiste). El bot la sigue controlando solo\n    (a los 30 s, 5, 15 y 30 min, 1, 4, 8, 12 y 24 h) y te avisa por el mismo chat\n    cuando se acredite. <strong>No lo vuelvas a mandar<\/strong> ni consultes a soporte durante\n    esas 24 horas: no lo acelera.<\/p><\/div><\/details><details class=\"acc\"><summary>⚠️ Validado anteriormente<\/summary><div class=\"acc-b\"><p>Ese comprobante ya se validó antes (te dice cuándo y con qué ID). No es un\n    rechazo: la transferencia es real, pero no se cuenta dos veces. Si creés que\n    nunca lo mandaste, avisá a soporte con el ID.<\/p><\/div><\/details><details class=\"acc\"><summary>❌ Inválido<\/summary><div class=\"acc-b\"><p>El bot no pudo confirmar la transferencia y te dice el motivo exacto con los\n    datos que leyó. Ver la tabla de motivos abajo.<\/p><\/div><\/details><\/div>\n<h3>Motivos de \"inválido\"<\/h3>\n<table>\n<thead>\n<tr>\n<th>Motivo<\/th>\n<th>Qué significa<\/th>\n<th>Qué hacer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CÓDIGO COELSA NO ENCONTRADO<\/strong><\/td>\n<td>Leyó un Coelsa pero no hay transferencia con ese código en nuestras cuentas.<\/td>\n<td>Compará el código (O vs 0, I vs 1); si está bien, la transferencia no fue a una cuenta nuestra.<\/td>\n<\/tr>\n<tr>\n<td><strong>TRANSFERENCIA NO ENCONTRADA<\/strong><\/td>\n<td>Sin Coelsa, y no hay transferencia con ese monto/cuenta/fecha.<\/td>\n<td>Esperá unos minutos y reenvialo; si sigue, mandá el comprobante completo con el Coelsa.<\/td>\n<\/tr>\n<tr>\n<td><strong>SIN CÓDIGO COELSA<\/strong><\/td>\n<td>No se ve el Coelsa ni el CVU de destino.<\/td>\n<td>Mandá el comprobante completo o el PDF de la app.<\/td>\n<\/tr>\n<tr>\n<td><strong>DATOS AMBIGUOS<\/strong><\/td>\n<td>Varias transferencias con ese monto a esa cuenta.<\/td>\n<td>Mandá el comprobante con el código Coelsa.<\/td>\n<\/tr>\n<tr>\n<td><strong>MONTO DIFIERE DEL COMPROBANTE<\/strong><\/td>\n<td>El monto del comprobante no coincide con el real.<\/td>\n<td>Revisá que sea el comprobante correcto; si fue editado, no se acepta.<\/td>\n<\/tr>\n<tr>\n<td><strong>CVU DESTINO NO ES NUESTRO<\/strong><\/td>\n<td>La transferencia fue a un CVU que no es nuestro.<\/td>\n<td>Revisá a qué cuenta transferiste; se resuelve con tu banco.<\/td>\n<\/tr>\n<tr>\n<td><strong>NOMBRE NO COINCIDE<\/strong><\/td>\n<td>El titular real no se parece al del comprobante.<\/td>\n<td>Si transfirió otra persona, tiene que mandar ella su comprobante.<\/td>\n<\/tr>\n<tr>\n<td><strong>FECHA NO COINCIDE<\/strong><\/td>\n<td>La fecha del comprobante y la real están muy alejadas.<\/td>\n<td>Revisá que sea el comprobante de la transferencia correcta.<\/td>\n<\/tr>\n<tr>\n<td><strong>ERROR TÉCNICO<\/strong><\/td>\n<td>No se pudo consultar el sistema.<\/td>\n<td>Esperá unos minutos y reintentá; si se repite, soporte.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"callout note\"><span class=\"ct\">Nota<\/span><div class=\"cb\"><p>Reenviar el mismo comprobante rechazado sin cambiar nada da el mismo motivo y no\n  se registra de nuevo. Lo que sirve es corregir lo que indica el motivo.<\/p><\/div><\/div>"], ["Soporte", "soporte", "<p>El bot no responde preguntas. Si necesitás ayuda con un comprobante, escribí a\nsoporte por WhatsApp con: el <strong>ID<\/strong> (<code>CBT-…<\/code>), una <strong>captura<\/strong> de la respuesta del\nbot y el <strong>comprobante original<\/strong>. Las consultas por comprobantes pendientes se\nresponden una vez pasadas las 24 horas.<\/p>"], ["Reclamos por texto (proveedores y operadores)", "reclamos-por-texto-proveedores-y-operadores", "<p>El bot también entiende reclamos de proveedores, sin foto. El mensaje tiene que ir\nsolo (sin imagen), empezar con <code>Reminder<\/code>, <code>Missing deposit<\/code> o <code>Missing cashout<\/code>\ny traer una línea <code>Amount:<\/code>.<\/p>\n<figure class=\"code\"><figcaption>Reclamo por un depósito<\/figcaption><pre><code>Missing deposit — please check this payment:\nYour reference: 36225200-2026-10-04-33246.00-586340870\nPayer name: Juan Ejemplo\nAmount: 33246.0 ARS\nDate: 2026-10-04 01:59 UTC<\/code><\/pre><\/figure>\n<p>El bot busca esa transferencia entre las que realmente entraron y responde:\nencontrado y acreditado, no se puede identificar (varias coincidencias) o no\nencontrado. Para <strong>cashout<\/strong> (plata que se envió) busca entre las salientes por el\ncódigo exacto y responde con el estado que informa el banco.<\/p>\n<div class=\"callout tip\"><span class=\"ct\">Tip<\/span><div class=\"cb\"><p>Cuanto más preciso el mensaje, mejor: con la hora exacta (<code>Date: … UTC<\/code>) casi\n  siempre se identifica solo. El texto del reclamo es solo la pregunta; todo lo que\n  responde el bot sale de los registros reales del banco.<\/p><\/div><\/div>"]]}, "release": {"title": "Release Notes", "crumb": "Release Notes", "lead": "Novedades y cambios de cada versión de Finpro.", "intro": "<div class=\"update\"><div class=\"uhead\"><span class=\"ubadge\">v1.5.0<\/span><span class=\"udate\">2026<\/span><\/div><div class=\"ubody\"><p><strong>Novedades<\/strong>\n  - Alerta por saldo mínimo con múltiples destinatarios (correos separados por <code>;<\/code>) y botón \"Enviar prueba\".\n  - Nuevo menú <strong>Consulta de COELSA<\/strong> (solo Administradores) para buscar una transferencia por su Coelsa ID.\n  - Bot de Telegram <strong>Finpro-Verificador<\/strong> para validar comprobantes.<\/p><\/div><\/div>\n<div class=\"update\"><div class=\"uhead\"><span class=\"ubadge\">Plantilla<\/span><span class=\"udate\">Fecha<\/span><\/div><div class=\"ubody\"><p>Reemplazá o agregá entradas como esta a medida que publiques nuevas versiones.<\/p>\n<p><strong>Novedades<\/strong>\n  - Punto 1<\/p>\n<p><strong>Correcciones<\/strong>\n  - Arreglo 1<\/p><\/div><\/div>", "secs": []}, "comofunciona": {"title": "Cómo funciona", "crumb": "Integración (API)", "lead": "Cuentas, Cliente API y avisos, explicado con diagramas.", "intro": "<div class=\"embed-wrap\"><iframe class=\"embed-deck\" src=\"como-funciona.html\" title=\"Cómo funciona Finpro\" loading=\"lazy\"><\/iframe><\/div>", "secs": []}}, "start": "home"}</script>
<script>
const DATA=JSON.parse(document.getElementById("docdata").textContent);
const PAGES=DATA.pages, NAV=DATA.nav;
let current=DATA.start, currentSec=null;

function renderSide(){
  const side=document.getElementById("sidenav");side.innerHTML="";
  NAV.forEach(([g,items])=>{
    const grp=document.createElement("div");grp.className="grp";
    const h=document.createElement("h4");
    h.innerHTML='<span class="chev">▼</span><span>'+g+'</span>';
    h.onclick=()=>grp.classList.toggle("closed");
    grp.appendChild(h);
    const pb=document.createElement("div");pb.className="pages";
    items.forEach(([id,label])=>{
      const pg=document.createElement("div");
      pg.className="pg"+(id===current?" active":" closed");
      const row=document.createElement("div");row.className="row";
      row.innerHTML='<span class="chev">▼</span><span class="lbl">'+label+'</span>';
      row.querySelector(".chev").onclick=e=>{e.stopPropagation();pg.classList.toggle("closed")};
      row.querySelector(".lbl").onclick=()=>openPage(id);
      pg.appendChild(row);
      const subs=document.createElement("div");subs.className="subs";
      (PAGES[id].secs||[]).forEach(([t,sid])=>{
        const a=document.createElement("div");a.className="sub";
        a.dataset.page=id;a.dataset.sec="sec-"+sid;a.textContent=t;
        if(id===current&&"sec-"+sid===currentSec)a.classList.add("on");
        a.onclick=()=>goto(id,"sec-"+sid);
        subs.appendChild(a);
      });
      pg.appendChild(subs);pb.appendChild(pg);
    });
    grp.appendChild(pb);side.appendChild(grp);
  });
}
const ICONS={
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6"/><path d="M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></svg>',
  bot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 2v4"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/><path d="M2 13v2M22 13v2"/></svg>',
  notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h11M8 12h11M8 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>'
};
const HOME=[
  ["manual","Uso de la plataforma","Cómo usar el portal: cuentas, saldos, movimientos, transferencias, seguridad y administración.","book"],
  ["api","Integración (API)","Conectá tus sistemas: autenticación, transferencias, estado, webhooks y conciliación.","plug"],
  ["verificador","Bot Finpro-Verificador","Validá comprobantes de transferencia por Telegram.","bot"],
  ["release","Release Notes","Novedades y cambios de cada versión de la plataforma.","notes"]
];
function renderHome(){
  const w=document.getElementById("wrap");
  let h='<div class="home"><div class="eyebrow">Documentación</div><h1>Documentación de Finpro</h1>'+
    '<p class="home-sub">Todo lo que necesitás para usar la plataforma e integrarte con la API.</p><div class="cards">';
  HOME.forEach(([id,t,d,ic])=>{
    h+='<button class="card" data-go="'+id+'"><span class="ic">'+ICONS[ic]+'</span>'+
       '<span><h3>'+t+'</h3><p>'+d+'</p></span>'+
       '<span class="arr"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>';
  });
  h+='</div></div>';
  w.classList.add("homeview");
  w.innerHTML=h;document.getElementById("main").scrollTop=0;
  w.querySelectorAll(".card").forEach(c=>c.onclick=()=>openPage(c.dataset.go));
}
function renderMain(){
  if(current==="home"){renderHome();return;}
  const p=PAGES[current],w=document.getElementById("wrap");
  w.classList.remove("homeview");
  let h='<div class="crumb">'+p.crumb+'</div><h1>'+p.title+'</h1>';
  if(p.lead)h+='<p class="lead">'+p.lead+'</p>';
  if(p.intro)h+='<div class="ct-body">'+p.intro+'</div>';
  (p.secs||[]).forEach(([t,sid,body])=>{
    h+='<section class="sec" id="sec-'+sid+'"><h2>'+t+'</h2><div class="ct-body">'+body+'</div></section>';
  });
  w.innerHTML=h;document.getElementById("main").scrollTop=0;wireTabs();
}
let LANG="curl";
try{const s=localStorage.getItem("finpro-lang");if(s)LANG=s;}catch(e){}
function applyLang(){
  document.querySelectorAll(".codetabs:not(.respbox)").forEach(ct=>{
    let has=false;
    ct.querySelectorAll(".ctab").forEach(b=>{const on=b.dataset.l===LANG;b.classList.toggle("on",on);if(on)has=true;});
    ct.querySelectorAll(".cpane").forEach(p=>p.classList.toggle("on",p.dataset.l===LANG));
    if(!has){ct.querySelector(".ctab")?.classList.add("on");ct.querySelector(".cpane")?.classList.add("on");}
  });
}
function wireCopy(){
  document.querySelectorAll(".copybtn").forEach(btn=>btn.onclick=async()=>{
    const box=btn.closest(".codetabs");
    const pane=box.querySelector(".cpane.on")||box.querySelector(".cpane");
    const txt=pane?pane.innerText:"";
    let ok=false;
    try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){
      try{const r=document.createRange();r.selectNodeContents(pane);const s=getSelection();s.removeAllRanges();s.addRange(r);ok=document.execCommand("copy");s.removeAllRanges();}catch(_){}
    }
    const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    if(ok){const o=btn.innerHTML;btn.innerHTML=CHECK;btn.classList.add("done");btn.title="Copiado";
      setTimeout(()=>{btn.innerHTML=o;btn.classList.remove("done");btn.title="Copiar";},1300);}
  });
}
function wireRun(){
  document.querySelectorAll(".runbtn").forEach(btn=>btn.onclick=()=>{
    const scope=btn.closest(".ep-right")||document;
    const wrap=scope.querySelector(".runwrap");if(!wrap)return;
    const ph=wrap.querySelector(".run-ph"),box=wrap.querySelector(".respbox");
    if(!box||!box.hidden)return;
    ph.classList.add("loading");ph.innerHTML='<span class="spin"></span>Ejecutando…';
    const delay=800+Math.floor(Math.random()*900);
    setTimeout(()=>{ph.style.display="none";box.hidden=false;},delay);
  });
}
function wireTabs(){
  document.querySelectorAll(".ctab").forEach(b=>b.onclick=()=>{
    LANG=b.dataset.l;try{localStorage.setItem("finpro-lang",LANG);}catch(e){}applyLang();
  });
  applyLang();wireCopy();wireRun();
}
function openPage(id){if(id!==current){current=id;currentSec=null;renderMain();}renderSide();close();}
function goto(id,sec){
  if(id!==current){current=id;currentSec=sec;renderMain();renderSide();
    requestAnimationFrame(()=>document.getElementById(sec)?.scrollIntoView({block:"start"}));
  }else{currentSec=sec;markSub();document.getElementById(sec)?.scrollIntoView({behavior:"smooth",block:"start"});}
  close();
}
function markSub(){document.querySelectorAll(".sub").forEach(a=>a.classList.toggle("on",a.dataset.page===current&&a.dataset.sec===currentSec));}
function close(){document.getElementById("side").classList.remove("open");}
document.getElementById("main").addEventListener("scroll",()=>{
  const m=document.getElementById("main"),secs=[...m.querySelectorAll(".sec")];let act=secs[0];
  for(const s of secs){if(s.getBoundingClientRect().top<150)act=s;}
  if(act){currentSec=act.id;markSub();}
});
function toggleTheme(){
  const r=document.documentElement;
  const dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
}
document.getElementById("menuBtn").onclick=()=>document.getElementById("side").classList.toggle("open");
document.querySelector(".brand").onclick=()=>openPage("home");
document.getElementById("floatMenu").onclick=()=>document.getElementById("side").classList.toggle("open");
try{if(window.self!==window.top)document.documentElement.classList.add("embedded");}catch(e){document.documentElement.classList.add("embedded");}

/* ---------- buscador ---------- */
const PAGELABEL={};
NAV.forEach(([g,items])=>items.forEach(([id,label])=>PAGELABEL[id]=label));
function strip(h){const d=document.createElement("div");d.innerHTML=h||"";return (d.textContent||"").replace(/\s+/g," ").trim();}
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
const INDEX=[];
Object.keys(PAGES).forEach(id=>{
  const p=PAGES[id], plabel=PAGELABEL[id]||p.title||id;
  const introText=strip((p.lead?("<p>"+p.lead+"</p>"):"")+(p.intro||""));
  if(introText) INDEX.push({page:id,sec:null,title:p.title||plabel,crumb:p.crumb||"",text:introText});
  (p.secs||[]).forEach(([t,sid,body])=>{
    INDEX.push({page:id,sec:"sec-"+sid,title:t,crumb:(p.title||plabel),text:strip(body)});
  });
});
function mark(escaped,words){
  let s=escaped;
  words.forEach(w=>{if(w.length<2)return;
    const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");s=s.replace(re,"<mark>$1</mark>");});
  return s;
}
function snippet(text,words){
  const nt=norm(text);let pos=-1;
  for(const w of words){const i=nt.indexOf(w);if(i>=0&&(pos<0||i<pos))pos=i;}
  if(pos<0)pos=0;
  const start=Math.max(0,pos-45);
  let s=text.slice(start,start+150);
  if(start>0)s="…"+s;
  if(start+150<text.length)s=s+"…";
  return mark(esc(s),words);
}
function doSearch(q){
  const nq=norm(q).trim();if(nq.length<2)return [];
  const words=nq.split(/\s+/).filter(Boolean);
  const res=[];
  INDEX.forEach(e=>{
    const nt=norm(e.title),hay=nt+" "+norm(e.text);
    if(words.every(w=>hay.includes(w))){
      let score=0;if(words.every(w=>nt.includes(w)))score+=10;if(nt.startsWith(words[0]))score+=5;
      res.push({e,score});
    }
  });
  res.sort((a,b)=>b.score-a.score);
  return res.slice(0,12).map(r=>r.e);
}
function closeSearch(){document.getElementById("results").classList.remove("open");}
function renderResults(q){
  const box=document.getElementById("results");
  const words=norm(q).trim().split(/\s+/).filter(Boolean);
  if(q.trim().length<2){box.classList.remove("open");box.innerHTML="";return;}
  const list=doSearch(q);
  if(!list.length){box.innerHTML='<div class="rempty">Sin resultados para "'+esc(q.trim())+'".</div>';box.classList.add("open");return;}
  box.innerHTML=list.map((e,i)=>
    '<button class="ritem" data-i="'+i+'"><div class="rt">'+mark(esc(e.title),words)+'</div>'+
    (e.crumb?'<div class="rp">'+esc(e.crumb)+'</div>':'')+
    '<div class="rs">'+snippet(e.text,words)+'</div></button>').join("");
  box.classList.add("open");
  box.querySelectorAll(".ritem").forEach((b,i)=>b.onclick=()=>{
    const e=list[i];if(e.sec)goto(e.page,e.sec);else openPage(e.page);
    document.getElementById("q").value="";closeSearch();
  });
}
(function(){
  const q=document.getElementById("q");
  q.addEventListener("input",()=>renderResults(q.value));
  q.addEventListener("keydown",e=>{
    if(e.key==="Escape"){q.value="";closeSearch();q.blur();}
    else if(e.key==="Enter"){const f=document.querySelector(".ritem");if(f)f.click();}
  });
  document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))closeSearch();});
})();

renderSide();renderMain();
</script>
</body>
</html>
